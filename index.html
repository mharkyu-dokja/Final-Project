
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Task Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Student Task Tracker</h1>
        <p>Organize your school tasks and deadlines.</p>

        <form id="taskForm">
            <input id="title" type="text"
                   placeholder="Task title" maxlength="100" required>

            <input id="subject" type="text"
                   placeholder="Subject" maxlength="50" required>

            <input id="deadline" type="date" required>

            <button type="submit">Add Task</button>
        </form>

        <p id="message" role="status"></p>

        <div class="filters">
            <button type="button" data-filter="all">All</button>
            <button type="button" data-filter="pending">Pending</button>
            <button type="button" data-filter="completed">Completed</button>
        </div>

        <h2>My Tasks</h2>
        <p id="summary"></p>
        <ul id="taskList"></ul>
    </div>

    <script src="script.js"></script>
</body>
</html>
